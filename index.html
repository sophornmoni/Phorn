<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phorn Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Khmer", sans-serif;
      background: #0f172a;
      color: white;
      line-height: 1.7;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
      position: sticky;
      top: 0;
    }

    header h2 {
      color: #60a5fa;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    nav a:hover {
      color: #60a5fa;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, #111827, #1e3a8a);
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero span {
      color: #60a5fa;
    }

    .hero p {
      font-size: 20px;
      color: #d1d5db;
      max-width: 650px;
    }

    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    section {
      padding: 70px 20px;
      max-width: 1000px;
      margin: auto;
    }

    section h2 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #60a5fa;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #cbd5e1;
    }

      text-align: center;
